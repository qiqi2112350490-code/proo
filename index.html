<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8f6">
    <meta name="description" content="Proo 专注于打造清晰、顺畅的使用体验，陪你从容探索，把灵感变成日常。">
    <title>Proo — 让灵感成为日常</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: #19251e;
        background: #f7f8f6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px 24px;
      }

      .card {
        width: min(100%, 880px);
        padding: clamp(40px, 9vw, 96px);
        border: 1px solid #e7eae5;
        border-radius: 28px;
        background: #fff;
        box-shadow: 0 24px 80px rgb(28 47 35 / 7%);
      }

      .brand {
        margin: 0 0 56px;
        color: #3c7655;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }

      h1 {
        max-width: 680px;
        margin: 0;
        font-size: clamp(36px, 7vw, 68px);
        font-weight: 650;
        letter-spacing: -0.045em;
        line-height: 1.2;
      }

      .description {
        max-width: 600px;
        margin: 28px 0 0;
        color: #68736b;
        font-size: clamp(16px, 2.3vw, 20px);
        line-height: 1.9;
      }

      .accent {
        width: 48px;
        height: 4px;
        margin-top: 48px;
        border-radius: 99px;
        background: #6da77d;
      }

      @media (max-width: 520px) {
        .brand {
          margin-bottom: 40px;
        }

        .card {
          border-radius: 20px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="headline">
        <p class="brand">PROO</p>
        <h1 id="headline">让想法更快落地，<br>让每一步都更简单。</h1>
        <p class="description">
          Proo 专注于打造清晰、顺畅的使用体验，陪你从容探索，把灵感变成日常。
        </p>
        <div class="accent" aria-hidden="true"></div>
      </section>
    </main>
  </body>
</html>
